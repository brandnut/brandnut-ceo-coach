version: "3.8"

services:
  ceo:
    image: ghcr.io/brandnut/brandnut-ceo-coach:saas
    ports:
      - "3005:3000"
    restart: unless-stopped
    environment:
      # Runtime secrets (set these in your environment or use .env file)
      - DATABASE_URL=${DATABASE_URL}
      - DIFY_API_KEY=${DIFY_API_KEY}
      - REDIS_URL=${REDIS_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SECRET_KEY=${SECRET_KEY}
      # Build-time variables (already embedded in image)
      - DIFY_API_URL
      - NEXTAUTH_URL
      - NEXT_PUBLIC_BASE_PATH
      - GUEST_MODE_ENABLED
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/ceo/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
