name: Build and Push Docker Image - SaaS

on:
  push:
    branches: [saas]
  pull_request:
    branches: [saas]

env:
  # 阿里云地址
  REGISTRY: ${{ secrets.DOCKER_REGISTRY_URL }}
  # 命名空间/仓库名
  IMAGE_NAME: brandnut/brandnut-ceo-coach

jobs:
  build:
    runs-on: ubuntu-latest
    environment: saas
    permissions:
      contents: read
      # 移除 write，阿里云不需要这个权限
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Alibaba Cloud ACR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest
            type=raw,value=saas

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # PR 时只构建不推送，Push 时推送
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            # Sensitive data from secrets
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            DIFY_API_KEY=${{ secrets.DIFY_API_KEY }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            BOCHA_API_KEY=${{ secrets.BOCHA_API_KEY }}
            OSS_ACCESS_KEY_ID=${{ secrets.OSS_ACCESS_KEY_ID }}
            OSS_ACCESS_KEY_SECRET=${{ secrets.OSS_ACCESS_KEY_SECRET }}
            MEMOS_API_KEY=${{ secrets.MEMOS_API_KEY }}
            BRANDNUT_MEMORY_API_KEY=${{ secrets.BRANDNUT_MEMORY_API_KEY }}
            # Configuration data from vars
            DIFY_API_URL=${{ vars.DIFY_API_URL }}
            GUEST_MODE_ENABLED=${{ vars.GUEST_MODE_ENABLED }}
            NEXTAUTH_URL=${{ vars.NEXTAUTH_URL }}
            NEXT_PUBLIC_BASE_PATH=${{ vars.NEXT_PUBLIC_BASE_PATH }}
            OSS_BUCKET=${{ vars.OSS_BUCKET }}
            OSS_REGION=${{ vars.OSS_REGION }}