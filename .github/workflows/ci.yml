name: CI/CD

on:
  push:
    branches:
      - main
      - "release-*"
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint
        continue-on-error: true


  # CD阶段 - 对main分支
  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set branch name and image tag
        id: branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "env=production" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/saas" ]]; then
            echo "tag=saas" >> $GITHUB_OUTPUT
            echo "env=saas" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_REGISTRY_URL }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (main branch)
        if: github.ref == 'refs/heads/main'
        id: meta-main
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY_URL }}/brandnut/brandnut-ceo-coach
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest

      - name: Extract metadata (saas branch)
        if: github.ref == 'refs/heads/saas'
        id: meta-saas
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_REGISTRY_URL }}/brandnut/brandnut-ceo-coach
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=saas

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta-main.outputs.tags || steps.meta-saas.outputs.tags }}
          labels: ${{ steps.meta-main.outputs.labels || steps.meta-saas.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DIFY_API_URL=${{ secrets.DIFY_API_URL }}
            DIFY_API_KEY=${{ secrets.DIFY_API_KEY }}
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            GUEST_MODE_ENABLED=${{ vars.GUEST_MODE_ENABLED }}
            NEXT_PUBLIC_BASE_PATH=${{ vars.NEXT_PUBLIC_BASE_PATH }}

      - name: Deploy to production server (main branch)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USERNAME }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /root/cicd/brandnut-ceo-coach
            git reset --hard
            git pull origin main
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p '${{ secrets.DOCKER_PASSWORD }}' ${{ secrets.DOCKER_REGISTRY_URL }}
            docker pull ${{ secrets.DOCKER_REGISTRY_URL }}/brandnut/brandnut-ceo-coach:latest
            docker compose down
            DOCKER_REGISTRY_URL=${{ secrets.DOCKER_REGISTRY_URL }} IMAGE_TAG=latest docker compose up -d
            docker image prune -a -f

      - name: Deploy to Singapore server (main branch)
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SG_HOST }}
          username: ${{ secrets.SG_USERNAME }}
          key: ${{ secrets.SG_SSH_KEY }}
          script: |
            cd /root/cicd/brandnut-ceo-coach
            git reset --hard
            git pull origin main
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p '${{ secrets.DOCKER_PASSWORD }}' ${{ secrets.DOCKER_REGISTRY_URL }}
            docker pull ${{ secrets.DOCKER_REGISTRY_URL }}/brandnut/brandnut-ceo-coach:latest
            docker compose down
            DOCKER_REGISTRY_URL=${{ secrets.DOCKER_REGISTRY_URL }} IMAGE_TAG=latest docker compose up -d
            docker image prune -a -f

